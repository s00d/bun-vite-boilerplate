services:
  app:
    container_name: myapp
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Same-origin by default; set the public URLs when the app is behind another host/port.
